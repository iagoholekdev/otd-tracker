<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OTD Tracker · WinnerBox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0e14;
    --panel: #131826;
    --panel-2: #171d2d;
    --border: #232b3d;
    --text: #e8eaf0;
    --text-dim: #8b93a7;
    --accent: #7c9cff;
    --ok: #4fd1a5;
    --ok-dim: rgba(79,209,165,0.12);
    --late: #f2645a;
    --late-dim: rgba(242,100,90,0.12);
    --neutral: #8b93a7;
    --neutral-dim: rgba(139,147,167,0.12);
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  .wrap{ max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }

  header.top{ margin-bottom: 32px; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px;
  }
  h1{ font-size: 28px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub{ color: var(--text-dim); font-size: 14px; margin:0; }

  .panel{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }

  form.filters{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 0;
  }
  form.filters .full{ grid-column: 1 / -1; }
  label{
    display:block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-weight: 500;
  }
  input[type=text], input[type=password], input[type=date]{
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
  }
  input:focus{ outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  .checkline{ display:flex; align-items:center; gap:8px; }
  .checkline input{ width:auto; }
  .checkline label{ margin:0; color: var(--text); font-size: 13px; }

  .actions{ margin-top: 20px; display:flex; align-items:center; gap:12px; }
  button.primary{
    background: var(--accent);
    color: #0b0e14;
    border:none;
    padding: 11px 20px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor:pointer;
    transition: transform .08s ease, opacity .15s ease;
  }
  button.primary:hover{ opacity:.9; }
  button.primary:active{ transform: scale(.98); }
  button.primary:disabled{ opacity:.5; cursor:not-allowed; }

  .hint{ color: var(--text-dim); font-size: 12px; }

  .status-line{ margin-top: 16px; font-size: 13px; }
  .status-line.err{ color: var(--late); font-family:'IBM Plex Mono', monospace; }

  .summary{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin: 28px 0;
  }
  .card{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .card .n{ font-family:'IBM Plex Mono', monospace; font-size: 26px; font-weight: 600; }
  .card .l{ color: var(--text-dim); font-size: 12px; margin-top: 4px; }
  .card.ok .n{ color: var(--ok); }
  .card.late .n{ color: var(--late); }
  .card.neutral .n{ color: var(--neutral); }

  table{ width:100%; border-collapse: collapse; font-size: 13px; }
  thead th{
    text-align:left;
    color: var(--text-dim);
    font-weight: 500;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 0 10px 10px;
    border-bottom: 1px solid var(--border);
  }
  tbody td{
    padding: 12px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr:hover{ background: var(--panel-2); }
  td.id{ font-family:'IBM Plex Mono', monospace; color: var(--text-dim); }
  td.title{ max-width: 320px; }
  td.date{ font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); white-space: nowrap; }

  .badge{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 600;
  }
  .badge.ok{ background: var(--ok-dim); color: var(--ok); }
  .badge.late{ background: var(--late-dim); color: var(--late); }
  .badge.neutral{ background: var(--neutral-dim); color: var(--neutral); }

  /* gauge de drift: barra centralizada em 0, cresce pra direita (atraso) ou esquerda (adiantado) */
  .gauge{
    width: 120px;
    height: 8px;
    background: var(--panel-2);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }
  .gauge .mid{
    position:absolute; left:50%; top:0; bottom:0; width:1px; background: var(--border);
  }
  .gauge .fill{
    position:absolute; top:0; bottom:0; border-radius: 4px;
  }
  .gauge-wrap{ display:flex; flex-direction:column; gap:4px; }
  .gauge-label{ font-family:'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); }

  .charts{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin: 20px 0;
  }
  @media (max-width: 760px){ .charts{ grid-template-columns: 1fr; } }
  .chart-card{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .chart-title{
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 2px;
  }
  .chart-sub{
    font-size: 11px;
    color: var(--text-dim);
    margin: 0 0 12px;
  }
  .chart-legend{
    display:flex; gap:16px; margin-top:10px; flex-wrap:wrap;
  }
  .chart-legend span{
    font-size:11px; color: var(--text-dim); display:flex; align-items:center; gap:6px;
  }
  .dot{ width:8px; height:8px; border-radius:2px; display:inline-block; }
  .target-line-input{
    display:flex; align-items:center; gap:6px; font-size:11px; color: var(--text-dim);
  }
  .target-line-input input{
    width: 56px; padding: 4px 6px; font-size: 12px;
  }
  .chart-header-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }

  .chart-svg{ width:100%; height:auto; display:block; }
  .chart-svg text{ font-family:'IBM Plex Mono', monospace; fill: var(--text-dim); }
  .svg-val{ font-size: 10px; fill: var(--text); font-weight: 600; }
  .svg-lbl{ font-size: 10px; }
  .svg-target{ font-size: 9px; fill: var(--accent); }

  /* toggle estilo iOS */
  .ios-toggle{
    display:flex; align-items:center; gap:10px;
  }
  .ios-toggle .switch{
    position: relative;
    width: 44px;
    height: 26px;
    flex-shrink: 0;
  }
  .ios-toggle .switch input{
    opacity: 0; width: 0; height: 0; position:absolute;
  }
  .ios-toggle .track{
    position:absolute; inset:0;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    transition: background .18s ease, border-color .18s ease;
  }
  .ios-toggle .track::before{
    content:"";
    position:absolute;
    left: 2px; top: 2px;
    width: 20px; height: 20px;
    background: #fff;
    border-radius: 50%;
    transition: transform .18s ease;
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .ios-toggle input:checked + .track{
    background: var(--ok);
    border-color: var(--ok);
  }
  .ios-toggle input:checked + .track::before{
    transform: translateX(18px);
  }
  .ios-toggle .toggle-label{ font-size: 13px; color: var(--text); cursor:pointer; user-select:none; }

  /* autocomplete visual do campo Assigned To */
  .assignee-field{ position: relative; }
  .assignee-row{ display:flex; gap:6px; }
  .assignee-row input{ flex:1; }
  .btn-ghost{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim);
    border-radius:8px; padding:0 10px; cursor:pointer; font-size:12px; white-space:nowrap;
  }
  .btn-ghost:hover{ color: var(--text); border-color: var(--accent); }
  .assignee-dropdown{
    position:absolute;
    top: calc(100% + 6px);
    left:0; right:0;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    max-height: 260px;
    overflow-y: auto;
    z-index: 20;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    display:none;
  }
  .assignee-dropdown.open{ display:block; }
  .assignee-option{
    display:flex; align-items:center; gap:10px;
    padding: 9px 12px;
    cursor:pointer;
  }
  .assignee-option:hover, .assignee-option.active{ background: var(--panel); }
  .assignee-avatar{
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent);
    color: #0b0e14;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 700;
    flex-shrink: 0;
  }
  .assignee-name{ font-size: 13px; color: var(--text); }
  .assignee-email{ font-size: 11px; color: var(--text-dim); font-family:'IBM Plex Mono', monospace; }
  .assignee-empty{ padding: 12px; font-size: 12px; color: var(--text-dim); text-align:center; }

  .empty, .loading{
    text-align:center;
    padding: 60px 20px;
    color: var(--text-dim);
    font-size: 14px;
  }
  .empty .big{ font-size: 32px; margin-bottom: 12px; }

  footer{ margin-top: 40px; color: var(--text-dim); font-size: 12px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="eyebrow">Azure DevOps · WinnerBox</p>
    <h1>OTD Tracker</h1>
    <p class="sub">PBIs fechados vs. Target Date — quem entregou no prazo e quem furou.</p>
  </header>

  <div class="panel">
    <form class="filters" id="filters">
      <div>
        <label for="org">Organização</label>
        <input type="text" id="org" placeholder="db1group" required>
      </div>
      <div>
        <label for="project">Team Project</label>
        <input type="text" id="project" placeholder="WinnerBox" value="WinnerBox" required>
      </div>
      <div class="full">
        <label for="pat">Personal Access Token</label>
        <input type="password" id="pat" placeholder="cole seu PAT aqui" required>
      </div>
      <div class="full assignee-field" id="assigneeField">
        <label for="assignedTo">Assigned To (Target)</label>
        <div class="assignee-row">
          <input type="text" id="assignedTo" placeholder="Digite seu nome..." autocomplete="off">
          <button type="button" id="btnMembers" class="btn-ghost" title="Carregar membros do time">↻ membros</button>
        </div>
        <div class="assignee-dropdown" id="assigneeDropdown"></div>
      </div>
      <div>
        <label for="dateFrom">Fechado de</label>
        <input type="date" id="dateFrom" required>
      </div>
      <div>
        <label for="dateTo">Fechado até</label>
        <input type="date" id="dateTo" required>
      </div>
      <div style="display:flex; align-items:flex-end;">
        <div class="ios-toggle">
          <span class="switch">
            <input type="checkbox" id="entregaFlag" checked>
            <span class="track" onclick="document.getElementById('entregaFlag').click()"></span>
          </span>
          <label class="toggle-label" for="entregaFlag">Só Entrega de Valor = SIM</label>
        </div>
      </div>
    </form>

    <div class="actions">
      <button class="primary" id="btnBuscar" type="button">Buscar entregas</button>
      <span class="hint">O PAT só é usado para essa consulta e não fica salvo em lugar nenhum.</span>
    </div>

    <div id="statusLine" class="status-line"></div>
  </div>

  <div id="resultsArea"></div>

  <footer>Roda 100% local — nada sai da sua máquina além das chamadas para dev.azure.com.</footer>
</div>

<script>
const $ = (id) => document.getElementById(id);

// datas default: mes atual
(function setDefaultDates(){
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth(), 1);
  const last = new Date(now.getFullYear(), now.getMonth()+1, 0);
  $('dateFrom').value = first.toISOString().slice(0,10);
  $('dateTo').value = last.toISOString().slice(0,10);
})();

function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('pt-BR');
}

function statusMeta(status){
  if(status === 'no_prazo') return {label:'No prazo', cls:'ok'};
  if(status === 'atrasado') return {label:'Atrasado', cls:'late'};
  return {label:'Sem target', cls:'neutral'};
}

function renderGauge(item){
  if(!item.hasTargetDate || !item.closedDate){
    return `<div class="gauge-wrap"><div class="gauge"><div class="mid"></div></div><span class="gauge-label">—</span></div>`;
  }
  const drift = item.driftDays; // negativo = adiantado, positivo = atrasado
  const clamped = Math.max(-15, Math.min(15, drift));
  const pct = (Math.abs(clamped) / 15) * 50; // metade da barra pra cada lado
  const isLate = drift > 0;
  const color = isLate ? 'var(--late)' : 'var(--ok)';
  const left = isLate ? '50%' : `${50 - pct}%`;
  const width = `${pct}%`;
  const label = drift === 0 ? 'no dia' : (isLate ? `+${drift}d` : `${drift}d`);
  return `<div class="gauge-wrap">
    <div class="gauge"><div class="mid"></div><div class="fill" style="left:${left}; width:${width}; background:${color};"></div></div>
    <span class="gauge-label">${label}</span>
  </div>`;
}

let targetPct = 80;
let lastItems = [];

function renderAll(){
  const resultsArea = $('resultsArea');
  resultsArea.innerHTML = renderSummary(lastItems) + renderCharts(lastItems) + renderTable(lastItems);
  const targetInput = document.getElementById('targetPctInput');
  if(targetInput){
    targetInput.addEventListener('change', () => {
      const v = parseFloat(targetInput.value);
      if(!isNaN(v) && v > 0 && v <= 100){
        targetPct = v;
        renderAll();
      }
    });
  }
}

function groupByMonth(items){
  const map = {};
  items.forEach(it => {
    if(!it.closedDate) return;
    const d = new Date(it.closedDate);
    if(isNaN(d)) return;
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if(!map[key]){
      map[key] = {
        key,
        label: d.toLocaleDateString('pt-BR', {month:'short'}).replace('.',''),
        total: 0, onTime: 0, late: 0, semTarget: 0
      };
    }
    map[key].total++;
    if(it.otdStatus === 'no_prazo') map[key].onTime++;
    else if(it.otdStatus === 'atrasado') map[key].late++;
    else map[key].semTarget++;
  });
  return Object.values(map).sort((a,b) => a.key.localeCompare(b.key));
}

function renderBarChart(months){
  const W = 560, H = 220, padL = 34, padB = 28, padT = 16, padR = 8;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const n = months.length || 1;
  const bw = Math.min(46, plotW / n * 0.55);
  const gap = plotW / n;

  const targetY = padT + plotH * (1 - targetPct/100);

  const bars = months.map((m, i) => {
    const pct = (m.onTime + m.late) > 0 ? (m.onTime / (m.onTime + m.late)) * 100 : 0;
    const has = (m.onTime + m.late) > 0;
    const h = has ? plotH * (pct/100) : 2;
    const x = padL + gap * i + (gap - bw)/2;
    const y = padT + plotH - h;
    const color = !has ? 'var(--neutral)' : (pct >= targetPct ? 'var(--ok)' : 'var(--late)');
    const label = has ? Math.round(pct) + '%' : '—';
    return `
      <rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${color}"></rect>
      <text x="${x + bw/2}" y="${y - 6}" text-anchor="middle" class="svg-val">${label}</text>
      <text x="${x + bw/2}" y="${padT + plotH + 16}" text-anchor="middle" class="svg-lbl">${m.label}</text>
    `;
  }).join('');

  return `
  <svg viewBox="0 0 ${W} ${H}" class="chart-svg">
    <line x1="${padL}" y1="${targetY}" x2="${W-padR}" y2="${targetY}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 3"></line>
    <text x="${W-padR}" y="${targetY - 5}" text-anchor="end" class="svg-target">meta ${targetPct}%</text>
    <line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="var(--border)" stroke-width="1"></line>
    ${bars}
  </svg>`;
}

function renderLineChart(months){
  const W = 560, H = 220, padL = 30, padB = 28, padT = 20, padR = 8;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const n = months.length;
  if(n === 0) return `<div class="hint" style="padding:40px 0; text-align:center;">Sem dados suficientes.</div>`;

  const maxVal = Math.max(1, ...months.map(m => m.total));
  const stepX = n > 1 ? plotW / (n - 1) : 0;

  const xAt = i => padL + stepX * i;
  const yAt = v => padT + plotH * (1 - v / maxVal);

  const totalPts = months.map((m,i) => `${xAt(i)},${yAt(m.total)}`).join(' ');
  const onTimePts = months.map((m,i) => `${xAt(i)},${yAt(m.onTime)}`).join(' ');

  const totalDots = months.map((m,i) => `<circle cx="${xAt(i)}" cy="${yAt(m.total)}" r="3" fill="var(--text)"></circle>`).join('');
  const onTimeDots = months.map((m,i) => `<circle cx="${xAt(i)}" cy="${yAt(m.onTime)}" r="3" fill="var(--ok)"></circle>`).join('');
  const labels = months.map((m,i) => `<text x="${xAt(i)}" y="${padT+plotH+16}" text-anchor="middle" class="svg-lbl">${m.label}</text>`).join('');

  return `
  <svg viewBox="0 0 ${W} ${H}" class="chart-svg">
    <line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="var(--border)" stroke-width="1"></line>
    <polyline points="${totalPts}" fill="none" stroke="var(--text-dim)" stroke-width="1.5"></polyline>
    <polyline points="${onTimePts}" fill="none" stroke="var(--ok)" stroke-width="2"></polyline>
    ${totalDots}${onTimeDots}${labels}
  </svg>`;
}

function renderCharts(items){
  const months = groupByMonth(items);
  if(months.length < 2){
    return `<div class="hint" style="margin:20px 0;">Visão mensal precisa de PBIs em pelo menos 2 meses diferentes — amplia o range de datas pra ver a evolução.</div>`;
  }
  return `
  <div class="charts">
    <div class="chart-card">
      <div class="chart-header-row">
        <div>
          <p class="chart-title">% OTD por mês</p>
          <p class="chart-sub">Entregues no prazo ÷ entregues com target date</p>
        </div>
        <div class="target-line-input">
          Meta <input type="text" id="targetPctInput" value="${targetPct}">%
        </div>
      </div>
      ${renderBarChart(months)}
    </div>
    <div class="chart-card">
      <p class="chart-title">Entregas por mês</p>
      <p class="chart-sub">Total fechado vs. no prazo</p>
      ${renderLineChart(months)}
      <div class="chart-legend">
        <span><span class="dot" style="background:var(--text-dim);"></span>Total fechado</span>
        <span><span class="dot" style="background:var(--ok);"></span>No prazo</span>
      </div>
    </div>
  </div>`;
}

function renderSummary(items){
  const total = items.length;
  const ok = items.filter(i => i.otdStatus === 'no_prazo').length;
  const late = items.filter(i => i.otdStatus === 'atrasado').length;
  const semTarget = items.filter(i => i.otdStatus === 'sem_target').length;
  return `
  <div class="summary">
    <div class="card"><div class="n">${total}</div><div class="l">Total de PBIs</div></div>
    <div class="card ok"><div class="n">${ok}</div><div class="l">No prazo</div></div>
    <div class="card late"><div class="n">${late}</div><div class="l">Atrasados</div></div>
    <div class="card neutral"><div class="n">${semTarget}</div><div class="l">Sem target date</div></div>
  </div>`;
}

function renderTable(items){
  const rows = items.map(item => {
    const s = statusMeta(item.otdStatus);
    return `<tr>
      <td class="id">#${item.id}</td>
      <td class="title">${escapeHtml(item.title)}</td>
      <td>${escapeHtml(item.assignedTo || '—')}</td>
      <td class="date">${fmtDate(item.createdDate)}</td>
      <td class="date">${fmtDate(item.targetDate)}</td>
      <td class="date">${fmtDate(item.closedDate)}</td>
      <td>${renderGauge(item)}</td>
      <td class="date">${item.cycleDays ? item.cycleDays + 'd' : '—'}</td>
      <td><span class="badge ${s.cls}">${s.label}</span></td>
    </tr>`;
  }).join('');

  return `
  <div class="panel" style="margin-top:20px; overflow-x:auto;">
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Título</th><th>Responsável</th><th>Criado</th>
          <th>Target</th><th>Fechado</th><th>Drift</th><th>Ciclo</th><th>Status</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function buscar(){
  const org = $('org').value.trim();
  const project = $('project').value.trim();
  const pat = $('pat').value.trim();
  const assignedTo = $('assignedTo').value.trim();
  const dateFrom = $('dateFrom').value;
  const dateTo = $('dateTo').value;
  const entregaFlag = $('entregaFlag').checked;

  const statusLine = $('statusLine');
  const resultsArea = $('resultsArea');
  const btn = $('btnBuscar');

  if(!org || !project || !pat || !assignedTo || !dateFrom || !dateTo){
    statusLine.className = 'status-line err';
    statusLine.textContent = 'Preenche organização, projeto, PAT, o teu nome e as datas.';
    return;
  }

  statusLine.className = 'status-line';
  statusLine.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Buscando...';
  resultsArea.innerHTML = `<div class="empty loading">Consultando o Azure DevOps...</div>`;

  try{
    const resp = await fetch('/api/query', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({org, project, pat, assignedTo, dateFrom, dateTo, entregaFlag})
    });
    const data = await resp.json();

    if(!resp.ok){
      throw new Error(data.error || 'erro desconhecido');
    }

    const items = data.items || [];
    lastItems = items;
    if(items.length === 0){
      resultsArea.innerHTML = `<div class="empty"><div class="big">·</div>Nenhum PBI encontrado com esses filtros.</div>`;
    } else {
      // ordena por drift (piores primeiro)
      items.sort((a,b) => (b.driftDays||0) - (a.driftDays||0));
      renderAll();
    }
  } catch(e){
    statusLine.className = 'status-line err';
    statusLine.textContent = 'Erro: ' + e.message;
    resultsArea.innerHTML = '';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Buscar entregas';
  }
}

let membersCache = [];

function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  const first = parts[0]?.[0] || '';
  const last = parts.length > 1 ? parts[parts.length-1][0] : '';
  return (first + last).toUpperCase();
}

function renderAssigneeOptions(list){
  const dd = $('assigneeDropdown');
  if(list.length === 0){
    dd.innerHTML = `<div class="assignee-empty">Nenhum nome encontrado. Clica em "↻ membros" ou digita livre.</div>`;
    return;
  }
  dd.innerHTML = list.map(m => `
    <div class="assignee-option" data-filter="${escapeHtml(m.filter)}">
      <span class="assignee-avatar">${escapeHtml(initials(m.displayName))}</span>
      <div>
        <div class="assignee-name">${escapeHtml(m.displayName)}</div>
        <div class="assignee-email">${escapeHtml(m.uniqueName)}</div>
      </div>
    </div>
  `).join('');
  dd.querySelectorAll('.assignee-option').forEach(opt => {
    opt.addEventListener('click', () => {
      $('assignedTo').value = opt.getAttribute('data-filter');
      closeAssigneeDropdown();
    });
  });
}

function openAssigneeDropdown(){
  $('assigneeDropdown').classList.add('open');
}
function closeAssigneeDropdown(){
  $('assigneeDropdown').classList.remove('open');
}

$('assignedTo').addEventListener('input', () => {
  const q = $('assignedTo').value.trim().toLowerCase();
  const filtered = q
    ? membersCache.filter(m => m.displayName.toLowerCase().includes(q) || m.uniqueName.toLowerCase().includes(q))
    : membersCache;
  renderAssigneeOptions(filtered);
  openAssigneeDropdown();
});

$('assignedTo').addEventListener('focus', () => {
  if(membersCache.length > 0){
    renderAssigneeOptions(membersCache);
    openAssigneeDropdown();
  }
});

document.addEventListener('click', (e) => {
  if(!document.getElementById('assigneeField').contains(e.target)){
    closeAssigneeDropdown();
  }
});

$('btnBuscar').addEventListener('click', buscar);

async function carregarMembros(){
  const org = $('org').value.trim();
  const project = $('project').value.trim();
  const pat = $('pat').value.trim();
  const statusLine = $('statusLine');
  const btn = $('btnMembers');

  if(!org || !project || !pat){
    statusLine.className = 'status-line err';
    statusLine.textContent = 'Preenche organização, projeto e PAT antes de carregar os membros.';
    return;
  }

  statusLine.className = 'status-line';
  statusLine.textContent = 'Carregando membros...';
  btn.disabled = true;

  try{
    const resp = await fetch('/api/members', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({org, project, pat})
    });
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error || 'erro desconhecido');

    membersCache = data.members || [];
    renderAssigneeOptions(membersCache);

    statusLine.textContent = membersCache.length
      ? `${membersCache.length} pessoa(s) encontradas nos últimos 180 dias — digita no campo "Assigned To" pra filtrar.`
      : 'Nenhum responsável encontrado nos últimos 180 dias com esses filtros.';
  } catch(e){
    statusLine.className = 'status-line err';
    statusLine.textContent = 'Erro ao carregar membros: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}

$('btnMembers').addEventListener('click', carregarMembros);
</script>
